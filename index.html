<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Key AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#17181b}
.wrap{max-width:760px;margin:auto;padding:22px 14px 40px}
header{padding:12px 4px 18px}h1{margin:0;font-size:28px}header p{margin:6px 0;color:#666}
.card{background:white;border:1px solid #e7e9ee;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 5px 20px rgba(0,0,0,.05)}
label{font-weight:650;display:block;margin-bottom:8px}.row{display:flex;gap:8px}
input,textarea{width:100%;border:1px solid #d8dbe2;border-radius:12px;padding:12px;font:inherit;outline:none}
textarea{min-height:90px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;font-weight:650;cursor:pointer;background:#111;color:#fff;white-space:nowrap}
button:disabled{opacity:.55}.result{margin-top:12px;padding:12px;border-radius:12px;background:#f2f4f7;white-space:pre-wrap;word-break:break-word}
.chat{min-height:180px;max-height:360px;overflow:auto;background:#fafafa;border-radius:12px;padding:10px;margin-bottom:10px}
.msg{padding:9px 11px;border-radius:12px;margin:7px 0;white-space:pre-wrap;word-break:break-word}.user{background:#e8eefc;margin-left:20%}.bot{background:#eee;margin-right:20%}
.small{font-size:13px;color:#777;margin-top:9px;line-height:1.45}
@media(max-width:560px){.row{flex-direction:column}button{width:100%}.user{margin-left:5%}.bot{margin-right:5%}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🔗 Link Key AI</h1><p>Kiểm tra redirect và trò chuyện với AI</p></header>

<section class="card">
<label for="url">URL cần kiểm tra</label>
<div class="row">
<input id="url" type="url" placeholder="https://example.com/...">
<button id="check">Kiểm tra link</button>
</div>
<div id="result" class="result" hidden></div>
<p class="small">Chỉ phân tích các chuyển hướng công khai. Không vượt CAPTCHA, Cloudflare, anti-bot hoặc cơ chế bảo vệ.</p>
</section>

<section class="card">
<label>Chatbot AI</label>
<div id="chat" class="chat"><div class="msg bot">Xin chào! Gửi URL hoặc câu hỏi về link cho mình.</div></div>
<textarea id="message" placeholder="Ví dụ: Link này có chuyển hướng không?"></textarea>
<div style="margin-top:8px"><button id="send">Gửi</button></div>
</section>
</div>

<script>
const $ = id => document.getElementById(id);
function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}
$("check").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return;
  $("check").disabled = true;
  $("result").hidden = false;
  $("result").textContent = "Đang kiểm tra...";
  try {
    const r = await fetch("/api/check", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Có lỗi");
    $("result").textContent =
      `HTTP: ${data.status}\n${data.message}` +
      (data.redirectedTo ? `\nĐích chuyển hướng: ${data.redirectedTo}` : "");
  } catch(e) {
    $("result").textContent = "Lỗi: " + e.message;
  } finally { $("check").disabled = false; }
};

async function send() {
  const message = $("message").value.trim();
  if (!message) return;
  $("message").value = "";
  addMsg(message, "user");
  $("send").disabled = true;
  addMsg("Đang xử lý...", "bot");
  const pending = $("chat").lastElementChild;
  try {
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message})
    });
    const data = await r.json();
    pending.textContent = r.ok ? data.answer : ("Lỗi: " + (data.error || "Không xác định"));
  } catch(e) {
    pending.textContent = "Không kết nối được máy chủ.";
  } finally { $("send").disabled = false; }
}
$("send").onclick = send;
$("message").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
