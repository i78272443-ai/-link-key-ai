<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Key AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#111;
}
.container{
  max-width:760px;
  margin:auto;
  padding:20px;
}
header{text-align:center;margin-bottom:20px}
header h1{margin-bottom:8px}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-weight:bold;
  font-size:15px;
}

button:disabled{opacity:.5}

.result{
  margin-top:15px;
  padding:13px;
  background:#f7f7f7;
  border-radius:10px;
  word-break:break-word;
  line-height:1.5;
}

.chat{
  min-height:180px;
  max-height:350px;
  overflow:auto;
  padding:10px;
  background:#f7f7f7;
  border-radius:10px;
  margin-bottom:12px;
}

.msg{
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  white-space:pre-wrap;
}

.user{background:#e5e7eb}
.ai{background:#eef2ff}

a{
  color:#2563eb;
  word-break:break-all;
}

.note{
  font-size:13px;
  color:#666;
  margin-top:10px;
}

@media(max-width:600px){
  .container{padding:12px}
  .buttons{flex-direction:column}
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>🔗 Link Key AI</h1>
<p>Kiểm tra và xử lý link công khai</p>
</header>

<!-- LINK -->
<div class="card">

<label>🔗 URL cần xử lý</label>

<input
  id="url"
  type="url"
  placeholder="Dán link FunLink, Linkvertise hoặc URL khác..."
>

<div class="buttons">

<button id="check">
🔍 Kiểm tra link
</button>

<button id="process">
🔗 Xử lý link
</button>

</div>

<div id="result" class="result">
Chưa có kết quả.
</div>

<div class="note">
⚠️ Chỉ xử lý chuyển hướng công khai. CAPTCHA, Cloudflare,
anti-bot và các cơ chế bảo vệ cần được thực hiện thủ công.
</div>

</div>


<!-- CHATBOT -->

<div class="card">

<label>🤖 Chatbot AI</label>

<div id="chat" class="chat">

<div class="msg ai">
Xin chào! 👋
Bạn có thể gửi URL hoặc hỏi tôi về một link.
</div>

</div>

<textarea
  id="message"
  placeholder="Nhập câu hỏi..."
></textarea>

<div class="buttons">
<button id="send">📤 Gửi</button>
</div>

</div>

</div>


<script>

const urlInput = document.getElementById("url");
const result = document.getElementById("result");


// ==========================
// KIỂM TRA LINK
// ==========================

document.getElementById("check").onclick = async () => {

  const url = urlInput.value.trim();

  if(!url){
    result.textContent = "❌ Vui lòng nhập URL.";
    return;
  }

  result.textContent = "⏳ Đang kiểm tra...";

  try{

    const res = await fetch("/api/check",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({url})
    });

    const data = await res.json();

    if(!res.ok)
      throw new Error(data.error || "Không thể kiểm tra.");

    result.innerHTML = `
      <b>📌 Trạng thái:</b> ${data.status || "Không rõ"}
      <br><br>
      ${
        data.location
        ? `<b>➡️ Redirect:</b><br>
           <a href="${data.location}" target="_blank">
           ${data.location}
           </a>`
        : "Không có redirect công khai."
      }
      <br><br>
      ${data.message || ""}
    `;

  }catch(err){

    result.textContent = "❌ " + err.message;

  }

};


// ==========================
// XỬ LÝ LINK CÔNG KHAI
// ==========================

document.getElementById("process").onclick = async () => {

  const url = urlInput.value.trim();

  if(!url){
    result.textContent = "❌ Vui lòng nhập URL.";
    return;
  }

  result.textContent =
    "⏳ Đang xử lý các redirect công khai...";

  try{

    const res = await fetch("/api/process",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({url})
    });

    const data = await res.json();

    if(!res.ok)
      throw new Error(data.error || "Không thể xử lý link.");

    let html = `
      <b>✅ Đã xử lý link công khai</b><br><br>
    `;

    if(data.finalUrl){

      html += `
        <b>🎯 Link đích:</b><br>
        <a href="${data.finalUrl}"
           target="_blank"
           rel="noopener noreferrer">
           ${data.finalUrl}
        </a>
        <br><br>

        <button onclick="window.open('${data.finalUrl}','_blank')">
          🔓 Mở link đích
        </button>
      `;
    }

    if(data.steps && data.steps.length){

      html += `
        <br><br>
        <b>📋 Các bước redirect:</b><br>
      `;

      data.steps.forEach((step,i)=>{
        html += `${i+1}. ${step}<br>`;
      });

    }

    if(data.message){
      html += `<br>${data.message}`;
    }

    result.innerHTML = html;

  }catch(err){

    result.textContent = "❌ " + err.message;

  }

};


// ==========================
// CHATBOT AI
// ==========================

const chat = document.getElementById("chat");
const message = document.getElementById("message");
const send = document.getElementById("send");

function addMessage(text,type){

  const div = document.createElement("div");

  div.className = "msg " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

send.onclick = async () => {

  const text = message.value.trim();

  if(!text) return;

  addMessage(text,"user");

  message.value = "";

  send.disabled = true;

  const loading = document.createElement("div");
  loading.className = "msg ai";
  loading.textContent = "⏳ AI đang trả lời...";
  chat.appendChild(loading);

  try{

    const res = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text
      })
    });

    const data = await res.json();

    if(!res.ok)
      throw new Error(data.error || "Chatbot lỗi.");

    loading.textContent =
      data.output ||
      data.message ||
      "Không có phản hồi.";

  }catch(err){

    loading.textContent = "❌ " + err.message;

  }

  send.disabled = false;

};


// Enter để gửi
message.addEventListener("keydown",(e)=>{

  if(e.key === "Enter" && !e.shiftKey){

    e.preventDefault();
    send.click();

  }

});

</script>

</body>
</html>
