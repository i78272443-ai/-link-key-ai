<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Link Key AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 15px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      color: #6b7280;
      margin-top: 8px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button.secondary {
      background: #111827;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: #f3f4f6;
      word-break: break-word;
      line-height: 1.5;
    }

    .success {
      background: #ecfdf5;
    }

    .warning {
      background: #fff7ed;
    }

    .error {
      background: #fef2f2;
    }

    .steps {
      margin-top: 10px;
      padding-left: 20px;
    }

    .chat {
      margin-top: 12px;
      max-height: 350px;
      overflow-y: auto;
    }

    .message {
      padding: 11px 13px;
      border-radius: 12px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      background: #dbeafe;
      margin-left: 30px;
    }

    .ai {
      background: #f3f4f6;
      margin-right: 30px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      margin-top: 10px;
      line-height: 1.5;
    }

    .code-box {
      margin-top: 15px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .code-box input {
      margin-top: 8px;
    }

    .open-button {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .buttons {
        flex-direction: column;
      }

      .header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🔗 Link Key AI</h1>
    <p>Kiểm tra và xử lý link công khai</p>
  </div>

  <!-- LINK PROCESSOR -->
  <div class="card">

    <label for="url">
      🔗 Link cần xử lý
    </label>

    <input
      id="url"
      type="url"
      placeholder="Dán link FunLink, Linkvertise hoặc link khác..."
    >

    <div class="buttons">

      <button id="check">
        🔎 Kiểm tra
      </button>

      <button id="process" class="secondary">
        🔑 Lấy mã / Xử lý link
      </button>

    </div>

    <div id="result" class="result" style="display:none;"></div>

    <!-- NHẬP MÃ -->
    <div
      id="codeArea"
      class="code-box"
      style="display:none;"
    >

      <label for="code">
        🔐 Nhập mã bạn nhận được
      </label>

      <input
        id="code"
        type="text"
        placeholder="Dán mã vào đây..."
      >

      <button
        id="confirmCode"
        style="margin-top:10px;"
      >
        ✅ Xác nhận mã
      </button>

      <div
        id="codeResult"
        class="result"
        style="display:none;"
      ></div>

    </div>

    <div class="small">
      Website chỉ xử lý các chuyển hướng công khai.
      Nếu trang yêu cầu CAPTCHA, Cloudflare hoặc xác minh
      người dùng, bạn sẽ phải tự thực hiện bước đó trên
      website.
    </div>

  </div>


  <!-- CHATBOT -->
  <div class="card">

    <label>
      🤖 Chatbot AI
    </label>

    <div
      id="chat"
      class="chat"
    ></div>

    <textarea
      id="message"
      placeholder="Hỏi AI về link..."
    ></textarea>

    <button
      id="send"
      style="margin-top:10px;"
    >
      Gửi
    </button>

  </div>

</div>


<script>

const urlInput = document.getElementById("url");
const result = document.getElementById("result");
const codeArea = document.getElementById("codeArea");
const codeInput = document.getElementById("code");
const codeResult = document.getElementById("codeResult");

const checkButton = document.getElementById("check");
const processButton = document.getElementById("process");
const confirmButton = document.getElementById("confirmCode");

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");

let currentFinalUrl = null;


/* =========================
   HIỂN THỊ KẾT QUẢ
========================= */

function showResult(text, type = "") {

  result.style.display = "block";
  result.className = "result " + type;
  result.textContent = text;

}


/* =========================
   KIỂM TRA LINK
========================= */

checkButton.addEventListener("click", async () => {

  const url = urlInput.value.trim();

  if (!url) {
    showResult("⚠️ Hãy nhập link trước.", "warning");
    return;
  }

  checkButton.disabled = true;
  checkButton.textContent = "Đang kiểm tra...";

  try {

    const response = await fetch("/api/check", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({ url })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Có lỗi xảy ra.");
    }

    if (data.location) {

      showResult(
        "✅ Có chuyển hướng công khai:\n\n" +
        data.location,
        "success"
      );

    } else {

      showResult(
        "ℹ️ Không tìm thấy chuyển hướng công khai.\n\n" +
        "Trang có thể yêu cầu xác minh hoặc xử lý bằng JavaScript.",
        "warning"
      );

    }

  } catch (error) {

    showResult(
      "❌ " + error.message,
      "error"
    );

  }

  checkButton.disabled = false;
  checkButton.textContent = "🔎 Kiểm tra";

});


/* =========================
   XỬ LÝ LINK
========================= */

processButton.addEventListener("click", async () => {

  const url = urlInput.value.trim();

  if (!url) {
    showResult("⚠️ Hãy nhập link trước.", "warning");
    return;
  }

  processButton.disabled = true;
  processButton.textContent = "⏳ Đang xử lý...";

  codeArea.style.display = "none";

  try {

    const response = await fetch("/api/process", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({ url })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Không thể xử lý.");
    }

    currentFinalUrl = data.finalUrl;

    let htmlText =
      "✅ Đã xử lý các chuyển hướng công khai.\n\n" +
      "🎯 Link hiện tại:\n" +
      data.finalUrl +
      "\n\n" +
      data.message;

    if (data.steps && data.steps.length) {

      htmlText +=
        "\n\n📍 Số bước chuyển hướng: " +
        data.steps.length;

    }

    showResult(
      htmlText,
      "success"
    );

    /*
      Hiện ô nhập mã.
      Mã ở đây do người dùng tự lấy từ website.
    */

    codeArea.style.display = "block";

  } catch (error) {

    showResult(
      "❌ " + error.message,
      "error"
    );

  }

  processButton.disabled = false;
  processButton.textContent = "🔑 Lấy mã / Xử lý link";

});


/* =========================
   XÁC NHẬN MÃ
========================= */

confirmButton.addEventListener("click", () => {

  const code = codeInput.value.trim();

  if (!code) {

    codeResult.style.display = "block";
    codeResult.className = "result warning";
    codeResult.textContent =
      "⚠️ Hãy nhập mã trước.";

    return;

  }

  /*
    Không tự gửi mã tới hệ thống bên thứ ba.
    Chỉ kiểm tra việc người dùng đã nhập mã.
  */

  codeResult.style.display = "block";
  codeResult.className = "result success";

  codeResult.textContent =
    "✅ Đã nhận mã: " +
    code +
    "\n\n" +
    "Nếu website đích yêu cầu mã này, hãy nhập mã " +
    "trên chính website đó.";

  if (currentFinalUrl) {

    const linkButton = document.createElement("a");

    linkButton.href = currentFinalUrl;
    linkButton.target = "_blank";
    linkButton.rel = "noopener noreferrer";
    linkButton.className = "open-button";
    linkButton.textContent = "🌐 Mở link";

    codeResult.appendChild(
      document.createElement("br")
    );

    codeResult.appendChild(linkButton);

  }

});


/* =========================
   CHATBOT
========================= */

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className =
    "message " +
    (type === "user" ? "user" : "ai");

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

}


sendButton.addEventListener("click", async () => {

  const message = messageInput.value.trim();

  if (!message) {
    return;
  }

  addMessage(message, "user");

  messageInput.value = "";

  sendButton.disabled = true;
  sendButton.textContent = "Đang trả lời...";

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({ message })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Chatbot lỗi.");
    }

    addMessage(
      data.reply,
      "ai"
    );

  } catch (error) {

    addMessage(
      "❌ " + error.message,
      "ai"
    );

  }

  sendButton.disabled = false;
  sendButton.textContent = "Gửi";

});


/* Enter để gửi chatbot */

messageInput.addEventListener("keydown", (event) => {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendButton.click();

  }

});

</script>

</body>
</html>
