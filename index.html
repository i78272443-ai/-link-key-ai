<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Key AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 15px 0 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #6366f1;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      color: white;
      flex: 1;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f9fafb;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat {
      min-height: 180px;
      max-height: 360px;
      overflow-y: auto;
      padding: 10px;
      background: #f9fafb;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .msg {
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .user {
      background: #e5e7eb;
    }

    .ai {
      background: #eef2ff;
    }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }

    a {
      color: #2563eb;
      word-break: break-all;
    }

    @media (max-width: 560px) {
      .wrap {
        padding: 12px;
      }

      .row {
        flex-direction: column;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <header>
    <h1>🔗 Link Key AI</h1>
    <p>Kiểm tra và xử lý chuyển hướng link công khai</p>
  </header>

  <!-- LINK -->
  <section class="card">

    <label for="url">🔗 URL cần xử lý</label>

    <input
      id="url"
      type="url"
      placeholder="https://example.com/..."
    >

    <div class="row">
      <button id="check">
        🔍 Kiểm tra link
      </button>

      <button id="process">
        🔗 Xử lý link
      </button>
    </div>

    <div id="result" class="result">
      Chưa có kết quả.
    </div>

    <div class="small">
      ⚠️ Chỉ xử lý các chuyển hướng công khai.
      Không vượt CAPTCHA, Cloudflare, anti-bot, paywall
      hoặc cơ chế bảo vệ của website.
    </div>

  </section>

  <!-- CHATBOT -->
  <section class="card">

    <label>🤖 Chatbot AI</label>

    <div id="chat" class="chat">
      <div class="msg ai">
        Xin chào! Gửi cho tôi một URL hoặc đặt câu hỏi về link.
      </div>
    </div>

    <textarea
      id="message"
      placeholder="Nhập câu hỏi..."
    ></textarea>

    <div class="row">
      <button id="send">
        📤 Gửi
      </button>
    </div>

  </section>

</div>

<script>

const urlInput = document.getElementById("url");
const result = document.getElementById("result");
const checkButton = document.getElementById("check");
const processButton = document.getElementById("process");


// ==========================
// KIỂM TRA LINK
// ==========================

checkButton.onclick = async () => {

  const url = urlInput.value.trim();

  if (!url) {
    result.textContent = "❌ Vui lòng nhập URL.";
    return;
  }

  checkButton.disabled = true;
  result.textContent = "⏳ Đang kiểm tra...";

  try {

    const response = await fetch("/api/check", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Không thể kiểm tra link.");
    }

    let text = "";

    text += "📌 Trạng thái: " + data.status + "\n";

    if (data.location) {
      text += "\n➡️ Link chuyển hướng:\n";
      text += data.location;
    }

    if (data.message) {
      text += "\n\n" + data.message;
    }

    result.textContent = text;

  } catch (error) {

    result.textContent = "❌ " + error.message;

  } finally {

    checkButton.disabled = false;

  }

};


// ==========================
// XỬ LÝ LINK CÔNG KHAI
// ==========================

processButton.onclick = async () => {

  const url = urlInput.value.trim();

  if (!url) {
    result.textContent = "❌ Vui lòng nhập URL.";
    return;
  }

  processButton.disabled = true;
  result.textContent = "⏳ Đang xử lý các chuyển hướng công khai...";

  try {

    const response = await fetch("/api/process", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Không thể xử lý link.");
    }

    let html = "";

    html += "<b>✅ Đã xử lý link công khai</b><br><br>";

    if (data.finalUrl) {

      html += "<b>🎯 Link đích:</b><br>";

      html += `
        <a
          href="${escapeHtml(data.finalUrl)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escapeHtml(data.finalUrl)}
        </a>
      `;

      html += `
        <div style="margin-top:12px">
          <button
            onclick="window.open('${escapeJs(data.finalUrl)}','_blank')"
          >
            🔓 Mở link đích
          </button>
        </div>
      `;

    }

    if (data.steps && data.steps.length) {

      html += "<br><b>📋 Các bước chuyển hướng:</b><br>";

      data.steps.forEach((step, index) => {

        html += `
          <div style="margin-top:8px">
            ${index + 1}. ${escapeHtml(step)}
          </div>
        `;

      });

    }

    if (data.message) {

      html += `
        <br>
        <div>${escapeHtml(data.message)}</div>
      `;

    }

    result.innerHTML = html;

  } catch (error) {

    result.textContent = "❌ " + error.message;

  } finally {

    processButton.disabled = false;

  }

};


// ==========================
// CHATBOT AI
// ==========================

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "msg " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

}


sendButton.onclick = async () => {

  const message = messageInput.value.trim();

  if (!message) {
    return;
  }

  addMessage(message, "user");

  messageInput.value = "";

  sendButton.disabled = true;

  addMessage("⏳ AI đang trả lời...", "ai");

  const loadingMessage = chat.lastElementChild;

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Chatbot lỗi.");
    }

    loadingMessage.textContent =
      data.output || data.message || "Không có phản hồi.";

  } catch (error) {

    loadingMessage.textContent =
      "❌ " + error.message;

  } finally {

    sendButton.disabled = false;

  }

};


// Nhấn Enter để gửi chatbot
messageInput.addEventListener("keydown", (event) => {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendButton.click();

  }

});


// ==========================
// BẢO VỆ HIỂN THỊ HTML
// ==========================

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJs(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}

</script>

</body>
</html>
